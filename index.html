<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML PROJECT 2</title>
</head>
<body>
    <h1>Chipi Technologies - Student Registration Form</h1>

    <label for="fullname">Full Name</label><br>
    <input type="text" id="fullname" placeholder="e.g Sami" required><br><br>

    <label for="email">Email Address</label><br>
    <input type="email" id="email" placeholder="e.g. nawaz@gmail.com" required><br><br>

    <label for="mobilenumber">Mobile Number</label><br>
    <input type="tel" id="mobilenumber" placeholder="e.g. 7854985621" required><br><br>

   <label for="gender">Gender:</label><br>
   <input type="radio" id="male" name="gender" value="Male">
   <label for="male">Male</label><br>

   <input type="radio" id="female" name="gender" value="Female">
   <label for="female">Female</label><br>

   <input type="radio" id="other" name="gender" value="Other">
   <label for="other">Other</label><br><br>


   <label for="course">Select Course:</label><br>
   <select name="course" id="course" required>
    <option value="">..Please choose an option</option>
    <option value="Java Full Stsck">Java Full Stsck</option>
    <option value="Frontend Development">Frontend Development</option>
    <option value="React with Projects">React with Projects</option>
    <option value="Data Structure In Java">Data Structure In Java</option>
    <option value="Python For Begineers">Python For Begineers</option>
   </select><br><br>


   <label for="comments">Any Comments Questions:</label><br>
   <textarea name="comments" id="comments" rows="4" cols="50" placeholder="Write Here.."></textarea>
    <br>
   <input type="submit" value="Register">
   <input type="reset" value="Clear Form">

   <p>&copy: Chipi Technologies All Right Reserved.</p>



   



    
</body>
</html>
